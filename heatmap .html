                            <div className="flex justify-between items-center">
                              <label className="text-xs text-gray-600">西文字体 (数字/字母)</label>
                              <select value={markerFontFamilyEN} onChange={e=>setMarkerFontFamilyEN(e.target.value)} className="text-xs border border-gray-300 p-1 outline-blue-500 rounded-sm w-32">
                                <option value="'Times New Roman', Times, serif">Times New Roman</option>
                                <option value="Arial, sans-serif">Arial</option>
                                <option value="Helvetica, sans-serif">Helvetica</option>
                                <option value="Roboto, sans-serif">Roboto</option>
                              </select>
                            </div>

                            <div className="flex justify-between items-center mt-2">
                              <label className="text-xs text-gray-600">文本颜色</label>
                              <div className="flex items-center gap-2">
                                <span className="text-[10px] font-mono text-gray-500 uppercase">{markerTextColor}</span>
                                <input type="color" value={markerTextColor} onChange={e=>setMarkerTextColor(e.target.value)} className="w-6 h-6 border border-gray-300 p-0 cursor-pointer rounded-sm bg-white" />
                              </div>
                            </div>
                            <div>
                              <div className="flex justify-between items-center mb-1">
                                <label className="text-xs text-gray-600">字号缩放</label>
                                <span className="text-xs font-mono bg-white border border-gray-200 px-1 rounded">{markerFontScale.toFixed(1)}x</span>
                              </div>
                              <input type="range" min="0.5" max="2.5" step="0.1" value={markerFontScale} onChange={e=>setMarkerFontScale(parseFloat(e.target.value))} className="w-full accent-blue-600" />
                            </div>
                            
                            <div className="flex justify-between items-center pt-2 border-t border-gray-200">
                               <span className="text-xs text-gray-600 font-semibold">自定义标注位置</span>
                               <button 
                                 onClick={() => { setHotLabelOffset({x:0,y:0}); setColdLabelOffset({x:0,y:0}); }}
                                 className="px-2 py-1 bg-gray-200 hover:bg-gray-300 rounded text-xs text-gray-700 transition-colors"
                               >
                                 恢复默认位置
                               </button>
                            </div>
                          </div>

                          <div className="border border-gray-200 rounded-sm p-3 bg-gray-50 space-y-3">
                            <div className="flex items-center border-b border-gray-200 pb-2">
                              <Palette size={14} className="text-gray-600 mr-1.5" />
                              <span className="text-xs font-semibold text-gray-700">坐标轴样式</span>
                            </div>
                            <div className="flex justify-between items-center">
                              <label className="text-xs text-gray-600">中文字体 (汉字)</label>
                              <select value={axisFontFamilyZH} onChange={e=>setAxisFontFamilyZH(e.target.value)} className="text-xs border border-gray-300 p-1 outline-blue-500 rounded-sm w-32">
                                <option value="'SimSun', serif">宋体 (SimSun)</option>
                                <option value="'SimHei', sans-serif">黑体 (SimHei)</option>
                                <option value="'KaiTi', serif">楷体 (KaiTi)</option>
                                <option value="'Microsoft YaHei', sans-serif">微软雅黑 (YaHei)</option>
                              </select>
                            </div>
                            <div className="flex justify-between items-center">
                              <label className="text-xs text-gray-600">西文字体 (数字/字母)</label>
                              <select value={axisFontFamilyEN} onChange={e=>setAxisFontFamilyEN(e.target.value)} className="text-xs border border-gray-300 p-1 outline-blue-500 rounded-sm w-32">
                                <option value="'Times New Roman', Times, serif">Times New Roman</option>
                                <option value="Arial, sans-serif">Arial</option>
                                <option value="Helvetica, sans-serif">Helvetica</option>
                                <option value="Roboto, sans-serif">Roboto</option>
                              </select>
                            </div>
                            <div className="flex justify-between items-center">
                              <label className="text-xs text-gray-600">线条类型</label>
                              <select value={axisLineStyle} onChange={e=>setAxisLineStyle(e.target.value)} className="text-xs border border-gray-300 p-1 outline-blue-500 rounded-sm">
                                <option value="dashed">虚线 (Dashed)</option>
                                <option value="solid">实线 (Solid)</option>
                              </select>
                            </div>
                            <div className="flex justify-between items-center">
                              <label className="text-xs text-gray-600">轴与文本颜色</label>
                              <div className="flex items-center gap-2">
                                <span className="text-[10px] font-mono text-gray-500 uppercase">{axisColor}</span>
                                <input type="color" value={axisColor} onChange={e=>setAxisColor(e.target.value)} className="w-6 h-6 border border-gray-300 p-0 cursor-pointer rounded-sm bg-white" />
                              </div>
                            </div>
                            <div>
                              <div className="flex justify-between items-center mb-1">
                                <label className="text-xs text-gray-600">线条粗细</label>
                                <span className="text-xs font-mono bg-white border border-gray-200 px-1 rounded">{axisLineWidth.toFixed(1)}x</span>
                              </div>
                              <input type="range" min="0.5" max="3.0" step="0.1" value={axisLineWidth} onChange={e=>setAxisLineWidth(parseFloat(e.target.value))} className="w-full accent-blue-600" />
                            </div>
                            <div>
                              <div className="flex justify-between items-center mb-1">
                                <label className="text-xs text-gray-600">字号缩放</label>
                                <span className="text-xs font-mono bg-white border border-gray-200 px-1 rounded">{axisFontScale.toFixed(1)}x</span>
                              </div>
                              <input type="range" min="0.5" max="2.5" step="0.1" value={axisFontScale} onChange={e=>setAxisFontScale(parseFloat(e.target.value))} className="w-full accent-blue-600" />
                            </div>
                          </div>
                        </>
                      )}
                    </div>
                  )}

                  {activeNode === 'export' && (
                    <div className="space-y-4">
                      {step !== 4 || !analysisData ? (
                        <p className="text-xs text-gray-500">计算未完成，无数据可导出。</p>
                      ) : (
                        <>
                          <div className="border border-gray-300 rounded-sm overflow-hidden text-xs">
                            <div className="bg-[#e5e7eb] px-2 py-1 font-semibold text-gray-700 border-b border-gray-300">
                              派生值 (Derived Values)
                            </div>
                            <div className="p-2 space-y-2 bg-white">
                              <div className="flex justify-between items-start pb-2 border-b border-gray-100">
                                <span className="flex items-center text-blue-700 whitespace-nowrap"><Snowflake size={14} className="mr-1" /> 局部极小值 (冷点)</span>
                                <div className="text-right">
                                  <div className="font-mono text-[11px] text-gray-800">[{coldPhys.x}, {coldPhys.y}] {unit}</div>
                                  <div className="text-[9px] text-gray-500">{originTextMap[originMode]}</div>
                                </div>
                              </div>
                              <div className="flex justify-between items-start pt-1">
                                <span className="flex items-center text-red-700 whitespace-nowrap"><Flame size={14} className="mr-1" /> 局部极大值 (热点)</span>
                                <div className="text-right">
                                  <div className="font-mono text-[11px] text-gray-800">[{hotPhys.x}, {hotPhys.y}] {unit}</div>
                                  <div className="text-[9px] text-gray-500">{originTextMap[originMode]}</div>
                                </div>
                              </div>
                            </div>
                          </div>

                          <div className="border border-gray-300 rounded-sm overflow-hidden text-xs mt-4">
                            <div className="bg-[#e5e7eb] px-2 py-1 font-semibold text-gray-700 border-b border-gray-300 flex justify-between items-center">
                              <span>导出图层设定</span>
                              <label className="flex items-center text-blue-700 cursor-pointer hover:text-blue-800 font-normal">
                                <input type="checkbox" checked={isAllExportSelected} onChange={handleToggleAllExport} className="mr-1 accent-blue-600" />
                                一键全选
                              </label>
                            </div>
                            <div className="p-2 space-y-2 bg-white">
                              <label className="flex items-center text-gray-700 cursor-pointer hover:bg-gray-50 p-1 rounded">
                                <input type="checkbox" checked={exportShowColdMarker} onChange={(e) => setExportShowColdMarker(e.target.checked)} className="mr-2 accent-blue-600" />
                                显示冷点标记 (MIN)
                              </label>
                              <label className="flex items-center text-gray-700 cursor-pointer hover:bg-gray-50 p-1 rounded">
                                <input type="checkbox" checked={exportShowHotMarker} onChange={(e) => setExportShowHotMarker(e.target.checked)} className="mr-2 accent-blue-600" />
                                显示热点标记 (MAX)
                              </label>
                              <label className="flex items-center text-gray-700 cursor-pointer hover:bg-gray-50 p-1 rounded">
                                <input type="checkbox" checked={exportShowCoords} onChange={(e) => setExportShowCoords(e.target.checked)} className="mr-2 accent-blue-600" />
                                显示极值坐标
                              </label>
                              <label className="flex items-center text-gray-700 cursor-pointer hover:bg-gray-50 p-1 rounded">
                                <input type="checkbox" checked={exportShowAxes} onChange={(e) => setExportShowAxes(e.target.checked)} className="mr-2 accent-blue-600" />
                                显示坐标轴
                              </label>
                              <label className="flex items-center text-gray-700 cursor-pointer hover:bg-gray-50 p-1 rounded">
                                <input type="checkbox" checked={exportShowROI} onChange={(e) => setExportShowROI(e.target.checked)} disabled={!enableROI} className="mr-2 accent-blue-600 disabled:opacity-40" />
                                <span className={!enableROI ? "text-gray-400" : ""}>显示局部区域框 (ROI) {!enableROI && "(需先开启ROI分析)"}</span>
                              </label>
                            </div>
                          </div>

                          <div className="border border-gray-300 rounded-sm overflow-hidden text-xs mt-4">
                            <div className="bg-[#e5e7eb] px-2 py-1 font-semibold text-gray-700 border-b border-gray-300">
                              导出格式 (Export Format)
                            </div>
                            <div className="p-2 space-y-2 bg-white">
                              <select value={exportFormat} onChange={e=>setExportFormat(e.target.value)} className="w-full border border-gray-300 p-1.5 outline-blue-500 rounded-sm text-xs">
                                <option value="png">PNG 图像 (*.png) - 推荐，极清无损</option>
                                <option value="jpg">JPEG 图像 (*.jpg) - 适合嵌入文档</option>
                                <option value="jpeg">JPEG 图像 (*.jpeg)</option>
                                <option value="webp">WebP 图像 (*.webp) - 网页优化格式</option>
                                <option value="bmp">BMP 位图 (*.bmp) - 原始无压缩像素</option>
                              </select>
                            </div>
                          </div>

                          <button onClick={handleDownloadClick} className="w-full py-2 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-800 text-sm font-bold rounded-sm flex justify-center items-center gap-2 mt-4 transition-colors">
                            <Save size={16} /> 导出结果图像
                          </button>
                        </>
                      )}
                    </div>
                  )}
                  
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 挂载 React 应用
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
